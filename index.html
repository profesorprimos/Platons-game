<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape from School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="play">
      <div id="hud" class="hud dim">
        <span id="hud-day" class="pill">Day 1</span>
        <span class="label">🚌</span>
        <div class="bar ride"><div id="ride-fill"></div><div id="ride-marks"></div></div>
        <span class="label">🏫</span>
        <span class="label gap">Noise</span>
        <div class="bar noise"><div id="noise-fill"></div></div>
      </div>

      <div class="stage">
        <canvas id="world" width="320" height="180"></canvas>
        <div id="hint" class="hint"></div>
        <div id="banner" class="banner hidden"></div>
        <div id="dialog" class="dialog hidden"></div>
        <div id="screen" class="screen"></div>
      </div>

      <div class="toolbar">
        <span class="label">Bag:</span>
        <span id="bag" class="bag"></span>
        <button id="bag-btn" type="button">🎒 Bag &amp; notebook (B)</button>
        <button id="help-btn" type="button">❓ How to play (H)</button>
      </div>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

name: Build Bus Clock widget

on:
  push:
    paths:
      - "bus-widget/**"
      - ".github/workflows/bus-widget.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bus-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bus-clock-apk
          path: bus-widget/app/build/outputs/apk/debug/app-debug.apk
